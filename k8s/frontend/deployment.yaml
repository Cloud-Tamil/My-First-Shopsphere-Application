apiVersion: apps/v1

kind: Deployment

metadata:

  name: frontend

  namespace: shopsphere

spec:

  replicas: 2


  selector:

    matchLabels:

      app: frontend


  template:

    metadata:

      labels:

        app: frontend


    spec:

      containers:

        - name: frontend

          image: FRONTEND_ECR_IMAGE

          ports:

            - containerPort: 80


          readinessProbe:

            httpGet:

              path: /

              port: 80

            initialDelaySeconds: 5

            periodSeconds: 10


          livenessProbe:

            httpGet:

              path: /

              port: 80

            initialDelaySeconds: 15

            periodSeconds: 20


          resources:

            requests:

              cpu: "100m"

              memory: "64Mi"

            limits:

              cpu: "300m"

              memory: "256Mi"
