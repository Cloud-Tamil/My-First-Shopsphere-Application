apiVersion: apps/v1

kind: Deployment

metadata:

  name: backend

  namespace: shopsphere

spec:

  replicas: 2


  selector:

    matchLabels:

      app: backend


  template:

    metadata:

      labels:

        app: backend


    spec:

      containers:

        - name: backend

          image: BACKEND_ECR_IMAGE

          ports:

            - containerPort: 8000


          env:

            - name: DB_HOST

              valueFrom:

                secretKeyRef:

                  name: shopsphere-secrets

                  key: DB_HOST


            - name: DB_PORT

              value: "5432"


            - name: DB_NAME

              value: "shopsphere"


            - name: DB_USER

              valueFrom:

                secretKeyRef:

                  name: shopsphere-secrets

                  key: DB_USER


            - name: DB_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: shopsphere-secrets

                  key: DB_PASSWORD


          readinessProbe:

            httpGet:

              path: /health

              port: 8000

            initialDelaySeconds: 10

            periodSeconds: 10


          livenessProbe:

            httpGet:

              path: /health

              port: 8000

            initialDelaySeconds: 20

            periodSeconds: 20


          resources:

            requests:

              cpu: "100m"

              memory: "128Mi"

            limits:

              cpu: "500m"

              memory: "512Mi"
