name: Deploy ShopSphere

on:

  workflow_dispatch:


permissions:

  id-token: write

  contents: read


jobs:

  deploy:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout

        uses: actions/checkout@v4


      - name: Configure AWS

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume:
            ${{ secrets.AWS_DEPLOY_ROLE }}

          aws-region:
            ap-south-1


      - name: Login to ECR

        id: login-ecr

        uses: aws-actions/amazon-ecr-login@v2


      - name: Build backend

        run: |

          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/shopsphere-dev/backend:${{ github.sha }} \
            ./backend


      - name: Push backend

        run: |

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/shopsphere-dev/backend:${{ github.sha }}


      - name: Build frontend

        run: |

          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/shopsphere-dev/frontend:${{ github.sha }} \
            ./frontend


      - name: Push frontend

        run: |

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/shopsphere-dev/frontend:${{ github.sha }}


      - name: Update kubeconfig

        run: |

          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name shopsphere-dev-eks


      - name: Deploy backend

        run: |

          kubectl set image \
            deployment/backend \
            backend=${{ steps.login-ecr.outputs.registry }}/shopsphere-dev/backend:${{ github.sha }} \
            -n shopsphere


      - name: Deploy frontend

        run: |

          kubectl set image \
            deployment/frontend \
            frontend=${{ steps.login-ecr.outputs.registry }}/shopsphere-dev/frontend:${{ github.sha }} \
            -n shopsphere


      - name: Check rollout

        run: |

          kubectl rollout status \
            deployment/backend \
            -n shopsphere

          kubectl rollout status \
            deployment/frontend \
            -n shopsphere
