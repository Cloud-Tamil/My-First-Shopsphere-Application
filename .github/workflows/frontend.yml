name: Frontend CI

on:

  push:

    branches:
      - main

    paths:
      - "frontend/**"


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout

        uses: actions/checkout@v4


      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: 22


      - name: Install dependencies

        working-directory: frontend

        run: npm install


      - name: Build

        working-directory: frontend

        run: npm run build
